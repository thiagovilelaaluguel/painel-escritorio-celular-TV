<script>
(function(){
var f=document.getElementById('f'),msg=document.getElementById('msg'),GUARDA='tv-celular-chave';
function de64(t){var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function para64(u){var t='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)t+=String.fromCharCode(u[i]);return btoa(t);}
var sal=de64(f.dataset.sal),iv=de64(f.dataset.iv),dado=de64(f.dataset.dado),voltas=+f.dataset.voltas,sc=window.crypto&&crypto.subtle;
function guardar(v){try{if(v)localStorage.setItem(GUARDA,v);else localStorage.removeItem(GUARDA);}catch(e){}}
function lida(){try{return localStorage.getItem(GUARDA);}catch(e){return null;}}
function mostrar(bruta,lembrar){
  return sc.importKey('raw',bruta,'AES-GCM',false,['decrypt']).then(function(k){
    return sc.decrypt({name:'AES-GCM',iv:iv},k,dado);}).then(function(p){
    if(lembrar)guardar(JSON.stringify({sal:f.dataset.sal,k:para64(bruta)}));
    var t=new TextDecoder().decode(p),sair='<div style="text-align:center;margin:24px 0"><a href="#" id="tv-sair">Esquecer a senha neste celular</a></div>';
    // o link entra antes do ULTIMO </body>: a pagina tem outro </body> dentro do codigo (relatorio para imprimir)
    var fim=t.toLowerCase().lastIndexOf('</body>');if(fim<0)fim=t.length;
    t=t.slice(0,fim)+sair+'<script>document.getElementById("tv-sair").onclick=function(e){e.preventDefault();try{localStorage.removeItem("'+GUARDA+'");}catch(x){}location.reload();};<\/script>'+t.slice(fim);
    document.open();document.write(t);document.close();});
}
if(!sc){msg.textContent='Este navegador não abre a página. Use o Chrome ou o Safari atualizado.';return;}
var g=lida();
// a entrada guardada so serve enquanto a senha for a mesma (mesmo sal); senha nova pede a senha de novo
// so depois de a pagina de entrada terminar de carregar: antes disso a troca de pagina mistura as duas
if(g)window.addEventListener('load',function(){try{var j=JSON.parse(g);if(j.sal===f.dataset.sal)
  mostrar(de64(j.k),false).catch(function(){guardar(null);});}catch(e){guardar(null);}});
f.addEventListener('submit',function(e){
  e.preventDefault();msg.textContent='Abrindo...';
  var senha=document.getElementById('s').value.trim(),lembrar=document.getElementById('lembrar').checked;
  sc.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveBits']).then(function(base){
    return sc.deriveBits({name:'PBKDF2',salt:sal,iterations:voltas,hash:'SHA-256'},base,256);
  }).then(function(bruta){return mostrar(bruta,lembrar);}).catch(function(){msg.textContent='Senha errada.';});
});
})();
</script>
</body></html>
